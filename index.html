<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kaina Edit Prompt</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:white;
}

header{
text-align:center;
padding:30px;
background:#000;
border-bottom:3px solid #00bfff;
}

.profile{
width:180px;
height:180px;
border-radius:50%;
object-fit:cover;
border:5px solid #00bfff;
box-shadow:0 0 25px #00bfff;
}

.slogan{
color:#00bfff;
margin-top:10px;
font-size:20px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

input,textarea,select{
width:100%;
padding:10px;
margin:5px 0;
border-radius:8px;
border:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
background:#00bfff;
color:white;
margin:3px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:#1e1e1e;
border-radius:12px;
padding:10px;
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:8px;
}

.badge{
background:orange;
padding:5px 10px;
border-radius:20px;
display:inline-block;
margin-bottom:10px;
}

.section-title{
margin-top:30px;
margin-bottom:10px;
color:#00bfff;
}

#adminPanel{
display:none;
background:#1a1a1a;
padding:15px;
border-radius:10px;
}

.dark-btn{
background:#444;
}

</style>
</head>

<body>

<header>

kaina-profile.jpg

<h1>KAINA EDIT PROMPT</h1>

<div class="slogan">
Transforming Shots To Another Level
</div>

</header>

<div class="container">

<h2 class="section-title">
Search Prompts
</h2>

<input
id="search"
placeholder="Search prompt..."
onkeyup="searchPrompts()">

<button onclick="showLogin()">
Admin Login
</button>

<h2 class="section-title">
Kaina Assistant
</h2>

<textarea
id="assistantText"
placeholder="Describe what you want...">
</textarea>

<button onclick="suggestPrompt()">
Generate Suggestion
</button>

<div id="suggestion"></div>

<div id="loginBox" style="display:none">

<h2 class="section-title">
Admin Login
</h2>

<input id="user" placeholder="Username">
<input id="pass" type="password" placeholder="Password">

<button onclick="login()">
Login
</button>

</div>

<div id="adminPanel">

<h2 class="section-title">
Add Prompt
</h2>

<input type="file" id="imageUpload">

<textarea
id="newPrompt"
placeholder="Prompt">
</textarea>

<select id="category">

<option>90s Filters</option>
<option>Anime</option>
<option>Photography</option>
<option>Cyberpunk</option>
<option>Fashion</option>
<option>Product Ads</option>

</select>

<button onclick="addPrompt()">
Add Prompt
</button>

</div>

<h2 class="section-title">
Featured Prompts
</h2>

<div class="grid" id="gallery"></div>

</div>

<script>

const ADMIN="admin";
const PASSWORD="1234";

let prompts=
JSON.parse(localStorage.getItem("kaina")) || [

{
category:"90s Filters",
image:"https://via.placeholder.com/400x250?text=Kodak+1995",
prompt:"Transform image into Kodak Gold 1995 film style."
},

{
category:"90s Filters",
image:"https://via.placeholder.com/400x250?text=VHS",
prompt:"Convert image into VHS camcorder tape effect."
},

{
category:"Fashion",
image:"https://via.placeholder.com/400x250?text=Y2K",
prompt:"Create Y2K fashion editorial look."
},

{
category:"Anime",
image:"https://via.placeholder.com/400x250?text=Anime",
prompt:"Transform photograph into detailed anime illustration."
},

{
category:"Cyberpunk",
image:"https://via.placeholder.com/400x250?text=Cyberpunk",
prompt:"Create futuristic neon cyberpunk city vibe."
}

];

function saveData(){

localStorage.setItem(
"kaina",
JSON.stringify(prompts)
);

}

function render(data=prompts){

let html="";

data.forEach((item,index)=>{

html+=`

<div class="card">

<div class="badge">
${item.category}
</div>

<img src="${item.image}">

<p>
${item.prompt}
</p>

<button onclick="copyPrompt(${index})">
Copy
</button>

<button onclick="editPrompt(${index})">
Edit
</button>

<button onclick="deletePrompt(${index})">
Delete
</button>

</div>

`;

});

document.getElementById("gallery")
.innerHTML=html;

}

function copyPrompt(i){

navigator.clipboard.writeText(
prompts[i].prompt
);

alert("Copied");

}

function editPrompt(i){

let value=
prompt(
"Edit Prompt",
prompts[i].prompt
);

if(value){

prompts[i].prompt=value;

saveData();
render();

}

}

function deletePrompt(i){

if(confirm("Delete Prompt?")){

prompts.splice(i,1);

saveData();
render();

}

}

function searchPrompts(){

let q=
document
.getElementById("search")
.value
.toLowerCase();

let filtered=
prompts.filter(
x=>x.prompt.toLowerCase().includes(q)
);

render(filtered);

}

function showLogin(){

document
.getElementById("loginBox")
.style.display="block";

}

function login(){

let u=
document.getElementById("user").value;

let p=
document.getElementById("pass").value;

if(u===ADMIN && p===PASSWORD){

document
.getElementById("adminPanel")
.style.display="block";

alert("Welcome Admin");

}else{

alert("Invalid Login");

}

}

function addPrompt(){

let file=
document.getElementById("imageUpload")
.files[0];

let promptText=
document.getElementById("newPrompt").value;

let category=
document.getElementById("category").value;

if(!file || !promptText){

alert("Add image and prompt");

return;

}

let reader=new FileReader();

reader.onload=(e)=>{

prompts.unshift({

category:category,
image:e.target.result,
prompt:promptText

});

saveData();
render();

};

reader.readAsDataURL(file);

}

function suggestPrompt(){

let input=
document
.getElementById("assistantText")
.value;

document
.getElementById("suggestion")
.innerHTML=`

<h3>Suggested Prompt</h3>

<p>
Transform this image into a premium professional edit.
Preserve details. Enhance lighting.
Add cinematic color grading.
Ultra realistic. 8K quality.
Based on: ${input}
</p>

`;

}

render();

</script>

</body>
</html>
