<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaina Edit Prompt</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
}

header{
text-align:center;
padding:40px 20px;
background:#000;
border-bottom:3px solid #00c6ff;
}

.hero{
width:200px;
height:200px;
border-radius:50%;
object-fit:cover;
border:5px solid #00c6ff;
box-shadow:0 0 25px #00c6ff;
}

h1{
margin-top:20px;
font-size:42px;
}

.slogan{
color:#00c6ff;
font-size:20px;
margin-top:10px;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.search{
width:100%;
padding:15px;
border:none;
border-radius:10px;
margin-bottom:20px;
}

.section-title{
margin:30px 0 15px;
color:#00c6ff;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:#151515;
border-radius:15px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,198,255,.2);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
}

.card-body{
padding:15px;
}

.card h3{
margin-bottom:10px;
}

.prompt{
margin-top:10px;
line-height:1.5;
}

.btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:10px;
margin-right:5px;
color:white;
}

.copy{
background:#00c6ff;
}

.fav{
background:#e91e63;
}

textarea,input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:10px;
}

#
